<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greater than 100</title>
</head>
<body>
    <script>
        let number = parseInt(prompt("Enter a number:"));
        if (number > 100){
            console.log(`${number} is greater than 100.`);
        }
    </script>
</body>
</html>
