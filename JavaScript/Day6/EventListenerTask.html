    <!-- Task 5: Double Click
    Create a paragraph that says Click Me Twice. When the user double-clicks the paragraph, change its text to Double-click event completed!. -->

    <p id="paragraph" style="cursor: pointer;">Click Me Twice</p>
    <script>
        let paragraph = document.getElementById("paragraph");
        paragraph.addEventListener("dblclick", function() {
            paragraph.textContent = "Double-click event completed!";
