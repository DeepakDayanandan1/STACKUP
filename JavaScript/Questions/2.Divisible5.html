<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisible by 5</title>
</head>
<body>
    <script>
        let number = parseInt(prompt("Enter a number:"));
        if (number % 5 == 0){
            console.log(`${number} is divisible by 5.`);
        }
    </script>
</body>
</html>
