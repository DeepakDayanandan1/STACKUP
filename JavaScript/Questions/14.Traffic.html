<!-- Write a program to display traffic signal meaning:
Red → Stop
Yellow → Ready
Green → Go
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal</title>
</head>
<body>
    <script>
        let signal = prompt("Enter the traffic signal color (red, yellow, green):");
        if (signal == "red") {
            console.log("Stop");
        } else if (signal == "yellow") {
            console.log("Ready");
        } else {
            console.log("Go");
        }
    </script>
</body>
</html>
