<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel</title>
</head>
<body>
    <script>
        let char = prompt("Enter a letter:");
        if (char == "a" || char == "e" || char == "i" || char == "o" || char == "u") {
            console.log(`${char} is a vowel.`);
        }
    </script>
</body>
</html>
