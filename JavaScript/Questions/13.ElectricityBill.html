<!-- Write a program to calculate electricity bill:
Units ≤ 100 → ₹1/unit
Units ≤ 200 → ₹2/unit
Units > 200 → ₹3/unit -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill</title>
</head>
<body>
    <script>
        let units = parseInt(prompt("Enter the number of units:"));
        if (units <= 100) {
            amount = units * 1;
        } else if (units <= 200) {
            amount = units * 2;
        } else {
            amount = units * 3;
        }
        console.log(`The electricity bill for ${units} units is Rs.${amount}.`);
    </script>
</body>
</html>
