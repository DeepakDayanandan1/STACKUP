<!-- Create the following variables:
studentName – store the student's name.
age – store the student's age.
course – store the course name.
mark1 – store the mark of the first subject.
mark2 – store the mark of the second subject.
mark3 – store the mark of the third subject.
numberOfSubjects – store the number of subjects.
Then:
Calculate the total marks.
Calculate the average marks. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var studentName = "Deepak"
        var age = 22
        var course = "Python"
        var mark1 = 80
        var mark2 = 85
        var mark3 = 90
        var numberOfSubjects = 3

        console.log(`Name: ${studentName}`);
        console.log(`Age: ${age}`);
        console.log(`Course: ${course}`);
        console.log(`Total marks: ${mark1+mark2+mark3}`);
        console.log(`Average marks: ${(mark1+mark2+mark3)/numberOfSubjects}`);
    </script>
</body>
</html>
