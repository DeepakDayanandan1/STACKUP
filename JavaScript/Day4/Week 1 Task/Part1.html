<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        /* Part 1: Basic Information and Variables
            1. Display the heading STUDENT MANAGEMENT SYSTEM.
            2. Create variables to store the following details:
                ○ Student name
                ○ Age
                ○ Course name
                ○ Three subject marks
            3. Use appropriate data types for each variable.
            4. Display all the student details using console.log(). */

        console.log("STUDENT MANAGEMENT SYSTEM");
        let studentName = prompt("Enter the student name:");
        let age = Number(prompt("Enter the student age:"));
        let courseName = prompt("Enter the course name:");
        let m1 = Number(prompt("Enter the mark of subject 1:"));
        let m2 = Number(prompt("Enter the mark of subject 2:"));
        let m3 = Number(prompt("Enter the mark of subject 3:"));


        console.log(`Name: ${studentName}`);
        console.log(`Age: ${age}`);
        console.log(`Course name: ${courseName}`);
        console.log(`Subject 1 Mark: ${m1}`);
        console.log(`Subject 2 Mark: ${m2}`);
        console.log(`Subject 3 Mark: ${m3}`); 
       
    </script>
</body>
