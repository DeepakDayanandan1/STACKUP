<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /* Part 4: Loops
            1. Use a for loop to display the numbers from 1 to 10.
            2. Use a while loop to display the numbers from 5 to 1.
            3. Use a loop to calculate the total of the student's three subject marks. */

        for(i=1;i<=10;i++){
            console.log(i);
        } 

        let j = 5;
        while(j>=1){
            console.log(j);
            j--;
        }

        let marks = [85, 90, 78];
        let total = 0;
        for (let k = 0; k < 3; k++) {
            total = total + marks[k];
        }
        console.log("Total marks:", total);
    </script>
</body>
</html>
