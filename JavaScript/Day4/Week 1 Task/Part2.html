<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /* Part 2: Data Types and Type Conversion
            1. Create variables containing a string, number, and Boolean value.
            2. Display the data type of each variable using typeof.
            3. Create a variable containing the string "85" and convert it into a number using Number().
            4. Add 10 to the converted value and display the result.
            5. Convert a number into a string using String() and display its data type. */

        let a = "Apple";
        let b = 10;
        let c = true;

        console.log(typeof(a));
        console.log(typeof(b));
        console.log(typeof(c));

        let v = "85";
        console.log(typeof(v));

        console.log(Number(v)+10);

        let n = 10;
        console.log(typeof(n));
        console.log(typeof(String(n)));
    </script>
</body>
</html>
