<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
        }
        .highlight {
            font-weight: 600;
            color: #3b82f6;
        }

        span {
            color: #3b82f6;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        .form-group input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px 0 0 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group button {
            padding: 0 1.5rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .form-group button:hover {
            background: #2563eb;
        }

        .form-group button:active {
            transform: scale(0.98);
        }

        .form-group button:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        /* Task list */
        #task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #task-list li {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        #task-list li:hover {
            border-color: #3b82f6;
            transform: translateX(4px);
        }

        #task-list li.completed {
            opacity: 0.7;
        }

        /* Task content */
        .task-checkbox {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            color: #1e293b;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #64748b;
        }

        /* Delete button */
        .delete-btn {
            padding: 0.4rem 0.8rem;
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        .delete-btn:focus-visible {
            outline: 2px solid #ef4444;
            outline-offset: 2px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
        }

        .empty-state p {
            margin: 0.5rem 0 0;
            font-size: 0.95rem;
        }

        /* Stats */
        .stats {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My <span class="highlight">To-Do List</span></h1>

        <form id="task-form" class="form-group">
            <input type="text" id="task-input" placeholder="Enter a task...">
            <button type="submit" id="addTask">Add Task</button>
        </form>

        <ul id="task-list"></ul>

        <div class="stats" id="stats">
            Tasks : <span id="total-tasks">0</span> | 
            Pending : <span id="pending-tasks">0</span> | 
            Completed : <span id="completed-tasks">0</span> 
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('todo-list')) || [];

        // DOM elements
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const totalTasksEl = document.getElementById('total-tasks');
        const pendingTasksEl = document.getElementById('pending-tasks');
        const completedTasksEl = document.getElementById('completed-tasks');

        // Render tasks to the DOM
        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <li class="empty-state">
                        <p>No tasks yet. Add one above!</p>
                    </li>
                `;
                updateStats();
                return;
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = task.completed ? 'completed' : '';
                li.dataset.index = index;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';
                checkbox.checked = task.completed;

                const taskText = document.createElement('span');
                taskText.className = 'task-text' + (task.completed ? ' completed' : '');
                taskText.textContent = task.text;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.dataset.index = index;

                li.appendChild(checkbox);
                li.appendChild(taskText);
                li.appendChild(deleteBtn);

                taskList.appendChild(li);
            });

            updateStats();
        }

        function saveTasks() {
            localStorage.setItem('todo-list', JSON.stringify(tasks));
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            totalTasksEl.textContent = total;
            completedTasksEl.textContent = completed;
            pendingTasksEl.textContent = total - completed;
        }

        function addTask(text) {
            const trimmedText = text.trim();
            if (!trimmedText) {
                alert('Please enter a task.');
                return;
            }

            tasks.push({
                text: trimmedText,
                completed: false
            });

            saveTasks();
            renderTasks();
            taskInput.value = '';
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }


        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        taskList.addEventListener('click', function(event) {
            const li = event.target.closest('li');

            if (event.target.classList.contains('delete-btn')) {
                const index = parseInt(event.target.dataset.index);
                deleteTask(index);
                return;
            }

            if (event.target.classList.contains('task-text')) {
                const index = parseInt(li.dataset.index);
                toggleTask(index);
            }
        });

        taskList.addEventListener('change', function(event) {
            if (event.target.classList.contains('task-checkbox')) {
                const li = event.target.closest('li');
                if (li) {
                    const index = parseInt(li.dataset.index);
                    toggleTask(index);
                }
            }
        });

        taskForm.addEventListener('submit', function(event) {
            event.preventDefault();
            addTask(taskInput.value);
        });

        renderTasks();
    </script>
</body>
</html>
