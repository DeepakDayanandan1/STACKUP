<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
</head>
<body>
    <script>
        let questions = [
            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: "1. int\n2. let\n3. string\n4. define",
                answer: "2. let",
                ansOption: "2"
            },
            {
                question: "Which function is used to display output in the browser console?",
                options: "1. print()\n2. display()\n3. console.log()\n4. show()",
                answer: "3. console.log()",
                ansOption: "3"
            },
            {
                question: "Which data type is used to store text in JavaScript?",
                options: "1. Number\n2. String\n3. Boolean\n4. Undefined",
                answer: "2. String",
                ansOption: "2"
            },
            {
                question: "Which symbol is used for a single-line comment in JavaScript?",
                options: "1. <!--\n2. ##\n3. //\n4. **",
                answer: "3. //",
                ansOption: "3"
            },
            {
                question: "Which keyword is used to declare a constant in JavaScript?",
                options: "1. var\n2. let\n3. const\n4. constant",
                answer: "3. const",
                ansOption: "3"
            }
        ];

        console.log("===== JAVASCRIPT QUIZ =====");

        let totalQuestions = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;

        for (let i=0;i<questions.length;i++){
            console.log(questions[i].question);
            console.log(questions[i].options);
            let chosen = prompt( questions[i].question + "\n\n" +
            questions[i].options + "\n\n" +
            "Enter your answer (1-4):");
            console.log("Enter your answer (1-4):",chosen);

            if (chosen == questions[i].ansOption){
                alert("Correct Answer!");
                console.log("Correct Answer!");
                totalQuestions+=1;
                correctAnswers+=1;
            }else{
                alert(`Incorrect Answer!\n\n Correct Answer:${questions[i].answer}`);
                console.log("Incorrect Answer!");
                console.log("Correct Answer:",questions[i].answer);
                totalQuestions+=1;
                incorrectAnswers+=1;
            }
        }

        console.log("===== QUIZ RESULT =====");
        console.log("Total Questions:",totalQuestions);
        console.log("Correct Answers:",correctAnswers);
        console.log("Incorrect Answers:",incorrectAnswers);
        console.log("Final Score:",correctAnswers,"/",totalQuestions);
        console.log("Percentage:",(correctAnswers/totalQuestions)*100,"%");
    </script>

    <H1>JavaScript Mini-Project: Quiz App</H1>
    <p>Open the browser console(F12->Console) to see the questions and results</p>
</body>
</html>
