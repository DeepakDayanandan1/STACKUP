<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Online Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="index">
        <div class="header">
            <div class="header-black" style="padding-left: 80px;">
                <span>Free Shipping</span>
                <span>|</span>
                <span>Return To Store</span>
                <span>|</span>
                <span>Online Gift Card</span>
            </div>
            <div class="header-black" style="padding-right: 80px;">
                <span>Delivering To</span>
                <span>|</span>
                <span>Download our Apps</span>
                <span>|</span>
                <span>Store Locator</span>
                <span>|</span>
                <span>Help</span>
            </div>
        </div>
        <div class="header-offwhite">
            <div class="max-logo">
                <span class="max">max</span>
            </div>
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <span class="search-text">What are you looking for?</span>
            </div>
            <button class="signin">
                SIGN UP / SIGN IN
            </button>
            <div class="header-item">
                <span>Favourites</span>
            </div>
            <div class="header-item">
                <span>Basket</span>
            </div>
            <div class="header-item">
                <span>More</span>
            </div>   
        </div>
        <div class="category-container">
            <div class="category">
                <div class="category-box"></div>
                <span>Women</span>
            </div>
            <div class="category">
                <div class="category-box"></div>
                <span>Men</span>
            </div>
            <div class="category">
                <div class="category-box"></div>
                <span>Kids</span>
            </div>
            <div class="category">
                <div class="category-box"></div>
                <span>Footwear</span>
            </div>
            <div class="category">
                <div class="category-box"></div>
                <span>Sleepwear</span>
            </div>
            <div class="category">
                <div class="category-box"></div>
                <span>GenZ Store</span>
            </div>
            <div class="category">
                <div class="category-box"></div>
                <span>Accessories</span>
            </div>
        </div>
        <hr> 
        <div class="ad">
            <img style="width: 100%; margin: auto; display: block;" src="public/ad.png" alt="advertisement">
        </div>
        <div class="comfort-section">
            <h2>Comfort Staples</h2>
            <div class="underline"></div>
            <div class="comfort-container">
                <div class="comfort-box">
                    <img src="public/ad2.png" alt="">
                </div>
                <div class="comfort-box">
                    <img src="public/ad1.png" alt="">
                </div>
            </div>

</div>
    </div>
</body>
</html>
